<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content" />
<meta name="theme-color" content="#0b2a4a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Settlers" />
<meta name="application-name" content="Settlers" />
<meta name="description" content="A real-time island settling race. Run, gather, build, and take the island before three rivals do." />
<title>Island Settlers</title>
<!-- Installable. "Maybe make it a PWA I can save to my homescreen so I don't
     see the URL bar for a start." Every path here is RELATIVE, because the
     game is served from a project subpath on GitHub Pages and an absolute
     "/manifest.webmanifest" would point at the root of the domain. -->
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./src/ui/ui.css" />
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <div id="ui"></div>
    <div id="rotate-gate">
      <div class="rg-inner">
        <div class="rg-phone"></div>
        <p>Rotate your device</p>
        <span>Island Settlers plays in landscape</span>
      </div>
    </div>
    <!-- ================================================== the cold open =====
         The first thing anyone ever sees, and the only screen in the build
         that is allowed to be expensive: nothing is being rendered behind it,
         so it can afford a painted sky, a silhouetted island, drifting cloud
         and a moving glint on the water. All of it is CSS gradients and one
         inline SVG — no images, no fonts, no requests. Styling lives in
         src/ui/ui-boot.css; the wordmark deliberately shares its bevel with
         the opening screen in src/systems/flowIntro.js. -->
    <div id="boot">
      <div class="bs-sky"></div>
      <div class="bs-sun"></div>
      <div class="bs-clouds"><i></i><i></i><i></i><i></i></div>
      <div class="bs-sea"><span class="bs-swell"></span><span class="bs-glint"></span></div>
      <!-- The silhouette. The viewBox is a deliberate 1200x132 letterbox: the
           element is ~9x as wide as it is tall on both target sizes, so the
           aspect agrees and nothing is stretched or cropped. -->
      <svg class="bs-isle" viewBox="0 0 1200 132" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <defs>
          <linearGradient id="bsRim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe0a0" stop-opacity=".9" />
            <stop offset="1" stop-color="#ffab3c" stop-opacity="0" />
          </linearGradient>
          <!-- The land is not one flat ink: it catches a little sky along the
               ridge and goes almost black where it meets the water. -->
          <linearGradient id="bsLandG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#143a5b" />
            <stop offset="0.5" stop-color="#0a2138" />
            <stop offset="1" stop-color="#04101c" />
          </linearGradient>
          <g id="bsPalm">
            <path d="M0 0 C-1.5 -12 -3.5 -22 -8 -32" stroke-width="3.4"
                  fill="none" stroke-linecap="round" />
            <path d="M-8 -32 C-20 -40 -30 -39 -36 -33 C-27 -36 -17 -35 -8 -32 Z" />
            <path d="M-8 -32 C-18 -44 -15 -53 -8 -57 C-11 -49 -10 -40 -8 -32 Z" />
            <path d="M-8 -32 C2 -45 12 -47 19 -43 C10 -42 1 -38 -8 -32 Z" />
            <path d="M-8 -32 C4 -32 13 -27 16 -20 C9 -26 0 -30 -8 -32 Z" />
            <path d="M-8 -32 C-16 -27 -21 -21 -22 -14 C-19 -22 -14 -28 -8 -32 Z" />
          </g>
        </defs>
        <!-- a further range, sitting back in the haze; it only shows through
             the dips in the near ridge, which is what makes the near ridge
             read as near -->
        <path class="bs-far" d="M0 132 L0 92 C80 88 140 80 210 84 C290 88 330 100 410 96
                 C510 91 580 70 680 66 C780 62 850 80 940 78
                 C1030 76 1120 70 1200 78 L1200 132 Z" />
        <!-- the island itself -->
        <path class="bs-land" d="M0 132 L0 104 C64 102 122 106 178 100 C216 96 238 84 274 78
                 C308 72 332 80 358 74 C394 66 406 50 450 42 C498 33 536 47 568 59
                 C598 70 628 77 666 75 C702 73 718 60 758 54 C802 48 840 63 874 74
                 C908 85 948 92 998 94 C1054 96 1130 93 1200 97 L1200 132 Z" />
        <!-- the sun-side edge of the ridge, caught by the light -->
        <path class="bs-lip" fill="none" stroke="url(#bsRim)" stroke-width="2.2"
              d="M358 74 C394 66 406 50 450 42 C498 33 536 47 568 59
                 C598 70 628 77 666 75 C702 73 718 60 758 54 C802 48 840 63 874 74
                 C908 85 948 92 998 94 C1054 96 1130 93 1200 97" />
        <g class="bs-palms">
          <use href="#bsPalm" transform="translate(440 44) scale(.5)" />
          <use href="#bsPalm" transform="translate(496 47) scale(.36)" />
          <use href="#bsPalm" transform="translate(752 56) scale(.44)" />
          <use href="#bsPalm" transform="translate(232 86) scale(.34)" />
        </g>
        <g class="bs-birds">
          <path d="M0 0 q5 -4 9 0 q4 -4 9 0" />
          <path d="M26 9 q3.5 -3 6.5 0 q3 -3 6.5 0" />
        </g>
      </svg>
      <div class="bs-boat">
        <svg viewBox="0 0 64 44" aria-hidden="true">
          <path d="M6 34 L58 34 L50 41 L14 41 Z" />
          <path d="M33 30 L33 7 L52 30 Z" />
          <path d="M29 30 L29 12 L15 30 Z" />
        </svg>
      </div>
      <div class="bs-vig"></div>
      <div class="bs-flash"></div>
      <div class="bs-fore">
        <div class="bs-crest">Island</div>
        <div class="bs-title">Settlers</div>
      </div>
      <!-- Parked on the deep water at the foot of the frame, well clear of the
           horizon, where a bevelled gold bar has something dark to sit on. -->
      <div class="bs-load">
        <div class="bs-bar"><span class="bs-fill"><i></i></span></div>
        <div class="bs-tip"><span>Charting the coastline</span></div>
      </div>
    </div>
  </div>
  <script>
  /* The splash is alive before a single module has parsed, so its two moving
     parts live here rather than in the build: the flavour line rotates, and
     the bar eases toward 92% because there is no honest byte counter to read.
     main.js sets `done` on #boot when the world exists — that is intercepted
     so the fill can land on 100 and the screen can hand over with a bloom
     instead of a cut. Defensive throughout: if any of it is missing the game
     still boots.

     MINIMUM HOLD. On a desktop the world is ready in well under a second and
     the whole cold open used to be gone before anyone could read the title —
     "it disappears so quickly I can't tell what the game is". So the handoff
     is now floored: whatever happens, the splash stays put for MIN_HOLD before
     the bar is allowed to land, and LAND ms after that it starts its bloom.
     Nothing here can make it feel stuck, because the floor is only ever a
     floor: a slow device passes it on the way and hands over the instant it
     is ready. Timings are published on window.__SPLASH__ so the capture rig
     can measure the real numbers rather than trust this comment. */
  (function () {
    var boot = document.getElementById('boot');
    if (!boot || !boot.querySelector) return;
    var MIN_HOLD = 2650;   // ms the artwork is guaranteed to stay readable
    var LAND = 430;        // the beat the bar needs to travel 92% -> 100%
    var clock = function () {
      return (window.performance && performance.now)
        ? performance.now() : (new Date()).getTime();
    };
    var t0 = clock();
    var S = window.__SPLASH__ = {
      minHold: MIN_HOLD, land: LAND,
      readyAt: -1, waitMs: -1, landedAt: -1, handoffAt: -1
    };
    var fill = boot.querySelector('.bs-fill');
    var tip = boot.querySelector('.bs-tip');
    var LINES = [
      'Charting the coastline',
      'Counting sheep in the pastures',
      'Weighing ore in the mountains',
      'Stamping the number tokens',
      'Mooring the docks against the tide',
      'Waking three rival settlers'
    ];
    var i = 1, p = 4, done = false, handing = false;

    function say(text) {
      if (!tip) return;
      while (tip.firstChild) tip.removeChild(tip.firstChild);
      var s = document.createElement('span');
      s.textContent = text;
      tip.appendChild(s);
    }
    var tipT = setInterval(function () {
      if (done) return;
      say(LINES[i++ % LINES.length]);
    }, 2300);

    var barT = setInterval(function () {
      if (done) return;
      p += (92 - p) * 0.055 + 0.35;
      if (p >= 91.9) { p = 92; clearInterval(barT); }
      if (fill) fill.style.width = p.toFixed(1) + '%';
    }, 90);

    function finish() {
      if (done) return;
      done = true;
      clearInterval(barT); clearInterval(tipT);
      if (fill) fill.style.width = '100%';
      say('Make landfall');
      S.landedAt = clock() - t0;
    }

    /* main.js sets `done` the moment the world exists. Take the class straight
       back off, serve out whatever is left of the minimum hold — the flavour
       line keeps rotating and the bar keeps easing through it, so the screen
       is never frozen — then land the bar and put the class back. */
    function watch() {
      if (handing || !boot.classList.contains('done')) return;
      handing = true;
      boot.classList.remove('done');
      S.readyAt = clock() - t0;
      var wait = MIN_HOLD - S.readyAt;
      if (!(wait > 0)) wait = 0;
      S.waitMs = wait;
      setTimeout(function () {
        finish();
        setTimeout(function () {
          S.handoffAt = clock() - t0;
          boot.classList.add('done');
        }, LAND);
      }, wait);
    }
    if (typeof MutationObserver === 'function') {
      new MutationObserver(watch).observe(boot, {
        attributes: true, attributeFilter: ['class']
      });
    } else {
      setInterval(watch, 120);
    }
  })();
  </script>
  <script>
  /* Register the worker, and only ever from a secure context — a plain-http
     LAN address is exactly where a half-registered worker goes wrong, and the
     dev server on 5173 has no business holding a cache anyway. Registered with
     an explicit relative scope so the Pages subpath is the scope and not the
     domain root. Failure is silent by design: the game does not need it. */
  /* NO PINCH-ZOOMING THE GAME.
     `maximum-scale=1,user-scalable=no` above has been ignored by iOS Safari
     since iOS 10, and by Chrome whenever Force-enable-zoom is on. WebKit's
     gesture events are the guard that still works, and they have to be
     cancelled at the document — every one of them is a two-finger pinch, and
     the only two-finger gesture this game wants is on the board map's own
     canvas, which handles its own pointer events and never reaches here as a
     `gesture*`.

     This is the fix for "after I play the game once and restart, the whole
     game is too zoomed in": a page scale acquired mid-match survives the
     reload that RESTART is, and comes back on the loading screen with the
     browser's own bar over the top of it. */
  /* `--vh` BEFORE ANYTHING ELSE PARSES.
     The splash is on screen for a couple of seconds before main.js exists, and
     it is bottom-anchored inside #app. On an engine with no `dvh`, #app falls
     back to `100vh` — the URL-bar-hidden height — and the loading bar is off
     the bottom of the page for the whole of that. Publishing the real height
     here costs three lines and is what "I can't see the full loading bar when
     the game is first starting up" was asking for. main.js keeps it updated
     from then on. */
  (function () {
    var vv = window.visualViewport;
    function setVh() {
      var h = (vv && vv.height) || window.innerHeight || 0;
      if (h > 0) document.documentElement.style.setProperty('--vh', (h / 100) + 'px');
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', function () { setTimeout(setVh, 200); });
    if (vv) { vv.addEventListener('resize', setVh); vv.addEventListener('scroll', setVh); }
  })();

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  /* A double-tap is the other way in on iOS. Anything the game wants a
     double-tap for handles its own pointer events. */
  (function () {
    var last = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - last <= 320 && e.cancelable) e.preventDefault();
      last = now;
    }, { passive: false });
  })();

  /* Chrome fires `beforeinstallprompt` once, early — often before the module
     graph has finished parsing — and if nobody calls preventDefault it puts up
     its own mini-infobar and then never offers again. Catch it here, at the top
     of the document, and park it; the opening screen's ADD TO HOME SCREEN chip
     reads it off the window and is the thing that finally calls prompt(). */
  window.__INSTALL__ = { evt: null };
  window.addEventListener('beforeinstallprompt', function (e) {
    if (e.preventDefault) e.preventDefault();
    window.__INSTALL__.evt = e;
    try { window.dispatchEvent(new Event('is-installable')); } catch (err) { /* ok */ }
  });

  (function () {
    if (!('serviceWorker' in navigator)) return;
    var ok = location.protocol === 'https:'
      || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (!ok) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(function (reg) {
          window.__PWA__ = { scope: reg.scope };
          // A worker that is waiting is a worker holding yesterday's build.
          if (reg.waiting) reg.waiting.postMessage('skip-waiting');
        })
        .catch(function () { /* offline play is a bonus, never a requirement */ });
    });
  })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
