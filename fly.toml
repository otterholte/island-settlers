# Island Settlers — Fly.io deployment for the multiplayer server.
#
#   fly launch --no-deploy --copy-config     # once, to claim the app name
#   fly deploy
#
# No volume and no secrets. The server holds rooms and players in memory and
# writes nothing, so there is nothing to persist and nothing to configure.
#
# Change `app` to whatever name you claimed, then put the matching websocket
# address into DEFAULT_SERVER in src/net/config.js — or just type it into the
# box behind SERVER on the multiplayer screen.

app = "island-settlers"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # MAX_MATCHES IS DELIBERATELY NOT SET. It used to be pinned at 6 — twenty-four
  # players, on any machine, forever — because the number was written for a
  # 256MB VM and never revisited. `server/capacity.mjs` now reads the cgroup
  # limits this VM actually has and sizes the ceiling from a measured cost per
  # match (~0.008 cores, 15-25MB; see tools/loadbench.mjs). Set this only to
  # override a machine it has read wrongly.

[http_service]
  internal_port = 8080
  force_https = true
  # NEVER SCALE THIS TO ZERO. A suspended machine drops every open websocket,
  # which means every match in progress. Fly's free allowance covers one small
  # always-on machine, and a game server that goes to sleep is not one.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # A match is a live websocket per player; a hard connection cap would drop
  # somebody mid-draft. The soft limit is where Fly starts preferring another
  # machine, if you ever run more than one.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

# ONE MACHINE, ON PURPOSE. Rooms live in memory, so two machines would be two
# separate games: a code made on one would not exist on the other, which is
# precisely the failure this whole screen was rewritten to make impossible.
# Scaling past this means moving the room registry out of the process.
# 512MB and one shared core held about 30 matches once the ceiling stopped
# being hardcoded. Two cores and 2GB is roughly 100 — a few hundred players —
# and is the smallest step that stops a modest influx hitting a wall. Both
# numbers are read at boot; `fly scale` and a restart is the whole procedure.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
